# Publishes to PyPI when you push a version tag, e.g.:
#   (bump version in pyproject.toml)  git tag v0.1.0 && git push origin v0.1.0
# Uses PyPI Trusted Publishing — no API token stored anywhere. One-time setup on pypi.org:
#   Your account → Publishing → Add a pending publisher → project "applyloop",
#   owner/repo = your GitHub repo, workflow = publish.yml, environment = pypi
name: publish
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' && pytest -q --ignore=tests/test_apply_e2e.py
      - run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
