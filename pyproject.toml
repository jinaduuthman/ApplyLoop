[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applyloop"
version = "0.1.0"
description = "A job-search agent: finds roles, scores fit, tailors your LaTeX CV and applies on employer forms."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "applyloop contributors"}]
keywords = ["job-search", "job-application", "ai", "llm", "resume", "latex", "automation", "cli", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "playwright>=1.40",
    "textual>=0.50",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0"]
stagehand = ["stagehand>=3.19"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/jinaduuthman/ApplyLoop"
Repository = "https://github.com/jinaduuthman/ApplyLoop"
Issues = "https://github.com/jinaduuthman/ApplyLoop/issues"

[project.scripts]
applyloop = "applyloop.cli:app"

[tool.setuptools.packages.find]
include = ["applyloop*"]

[tool.setuptools.package-data]
applyloop = ["starter/*", "assets/templates/*", "assets/fonts/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
